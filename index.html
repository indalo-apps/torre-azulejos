<style>
:root{--bg:#eef2f8;--card:#ffffff;--ink:#14243d;--ink2:#4d5b73;--soft:#e3e9f3;--line:#cfd8e6;--acc:#14325c;--acc-ink:#fff;--link:#1d4f9a;--focus:#2563eb;color-scheme:light}

  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none;touch-action:manipulation}

.nov h4{margin:14px 0 4px}

.steps{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:st}

.kbd{display:inline-block;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:0 6px;font-weight:700}
.hintbox{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:.9rem}
.howto{margin:8px 0 0;padding-left:20px}.howto li{margin:6px 0}
#barra-act{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:60;background:var(--acc);color:var(--acc-ink);font-weight:800;font-size:.9rem;padding:9px 16px;border-radius:999px;box-shadow:0 6px 20px -8px rgb(0 0 0 / .5)}

/* Pantalla de juego */
#juego{position:fixed;inset:0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#juego canvas{display:block;width:100%;height:100%}
.hud-btn{position:absolute;z-index:5;width:48px;height:48px;border-radius:50%;border:0;background:rgb(0 0 0 / .35);color:#fff;font-size:1.3rem;font-weight:800;display:grid;place-items:center;backdrop-filter:blur(4px)}
.over{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:20px;background:rgb(0 0 0 / .45)}
.over[hidden]{display:none}
.card{background:var(--card);color:var(--ink);border-radius:24px;padding:22px 20px;width:100%;max-width:380px;text-align:center;box-shadow:0 20px 50px -20px rgb(0 0 0 / .6);animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.card h2{margin:0 0 6px;font-size:1.6rem}
.card .big{font-size:3rem;font-weight:900;margin:6px 0;font-variant-numeric:tabular-nums}
.card .row{justify-content:center;margin-top:16px}
.card .btn{min-width:130px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>

<script>
const CFG={"repo": "torre-azulejos", "pre": "ta", "nombre": "Torre de Azulejos", "corto": "Torre de Azulejos", "color": "#14325c", "aviso": "Juego de habilidad para entretenerse. Los azulejos están inspirados en la lacería andalusí, pero son dibujos propios de la app y no reproducen ningún alicatado real.", "soporte": "https://github.com/indalo-apps/torre-azulejos/issues"};
const NOVEDADES=[["1.0", ["🧱 Primera versión: apila azulejos de lacería con un toque", "✨ «¡Perfecto!» al acertar justo; con 3 seguidos el azulejo vuelve a crecer", "📅 Reto del día: una altura distinta cada día y racha de días cumplidos", "🏆 Récord y mejor racha de perfectos guardados en el móvil", "📲 Se instala en el móvil, funciona sin conexión y se actualiza sola"]]];
window.APP={};
/* ===================== PIEZAS COMUNES (indalo-apps) ===================== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const P=CFG.pre;                       // prefijo de las claves guardadas en el móvil
const VERSION=(document.querySelector('meta[name="app-version"]')||{}).content||"dev";
const AUTORES="Adela Moreno Vega y Carlos Moreno Otto";
const APP=window.APP||{};               // ganchos que define cada juego
function anunciar(t){const r=$('#sr');r.textContent='';setTimeout(()=>{r.textContent=t},30)}
function verCmp(a,b){const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d}return 0}
const REDUCIR=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
// Márgenes del área segura (isla, barra de inicio) en píxeles, para dibujar en el lienzo
const _sa=document.createElement('div');_sa.setAttribute('aria-hidden','true');
_sa.style.cssText='position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
document.body.appendChild(_sa);
function safe(l){return parseFloat(getComputedStyle(_sa)['padding'+l[0].toUpperCase()+l.slice(1)])||0}

/* ---------- Preferencias y aspecto ---------- */
let PREF=Object.assign({fs:'m',theme:'auto',sound:true,vibra:true},store.get(P+'-pref-v1',{}));
function guardarPref(){store.set(P+'-pref-v1',PREF)}
function applyLook(){const r=document.documentElement;r.dataset.fs=PREF.fs;
  const dark=PREF.theme==='dark'||(PREF.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
  r.dataset.theme=dark?'dark':'light';
  $$('meta[name="theme-color"]').forEach(m=>m.remove());
  const m=document.createElement('meta');m.name='theme-color';m.content=getComputedStyle(r).getPropertyValue('--bg').trim()||CFG.color;document.head.appendChild(m);
  if(APP.onLook)APP.onLook();}
applyLook();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyLook);

/* ---------- Sonido y vibración ---------- */
let AC=null;
function audio(){if(!PREF.sound)return null;try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){AC=null}return AC}
addEventListener('pointerdown',()=>{if(PREF.sound)audio()},{once:true,capture:true});
function tono(f,d=.12,tipo='sine',vol=.18,f2=null,delay=0){const a=audio();if(!a)return;const t=a.currentTime+delay;
  const o=a.createOscillator(),g=a.createGain();o.type=tipo;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02);}
function ruido(d=.2,vol=.25,corte=1200){const a=audio();if(!a)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);
  for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=corte;
  const g=a.createGain();g.gain.value=vol;s.connect(fl).connect(g).connect(a.destination);s.start();}
function vibrar(p){if(PREF.vibra&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}

/* ---------- Hojas (ventanas que suben desde abajo) ---------- */
let sheetOpener=null,skipPop=false;
function openSheet(html,label){const s=$('#sheet');
  s.innerHTML=`<div class="sheet-bg" data-close="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="${label}"><div class="grab"></div><button class="x-close" data-close="btn" aria-label="Cerrar">✕</button>${html}</div></div>`;
  s.hidden=false;if(!sheetOpener||!document.body.contains(sheetOpener))sheetOpener=document.activeElement;
  if(!(history.state&&history.state.sheet))history.pushState({sheet:1,juego:!!(history.state&&history.state.juego)},'');
  const sh=s.querySelector('.sheet');sh.tabIndex=-1;sh.focus({preventScroll:true});if(APP.onSheet)APP.onSheet(true);}
function closeSheet(fromPop){const s=$('#sheet');if(s.hidden)return;s.hidden=true;s.innerHTML='';
  if(sheetOpener&&document.body.contains(sheetOpener))sheetOpener.focus({preventScroll:true});sheetOpener=null;
  if(!fromPop&&history.state&&history.state.sheet){skipPop=true;history.back()}if(APP.onSheet)APP.onSheet(false);}
addEventListener('popstate',()=>{if(skipPop){skipPop=false;return}if(!$('#sheet').hidden){closeSheet(true);return}if(APP.enPantallaJuego&&APP.enPantallaJuego())APP.salir(true)});
addEventListener('keydown',e=>{if($('#sheet').hidden)return;if(e.key==='Escape'){e.preventDefault();closeSheet();return}
  if(e.key==='Tab'){const f=[...$('#sheet').querySelectorAll('button:not([disabled]),a[href],input')];if(!f.length)return;const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&(document.activeElement===a||document.activeElement.classList.contains('sheet'))){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});
$('#sheet').addEventListener('click',e=>{if(e.target.dataset.close||e.target.closest('[data-close="btn"]'))closeSheet()});
(function(){let y0=null,dy=0,el=null;
  $('#sheet').addEventListener('touchstart',e=>{el=e.target.closest('.sheet');if(!el||el.scrollTop>0){el=null;return}y0=e.touches[0].clientY;dy=0},{passive:true});
  $('#sheet').addEventListener('touchmove',e=>{if(!el)return;dy=e.touches[0].clientY-y0;if(dy>0){el.classList.add('drag');el.style.transform=`translateY(${dy}px)`}},{passive:true});
  $('#sheet').addEventListener('touchend',()=>{if(!el)return;el.classList.remove('drag');if(dy>90)closeSheet();else el.style.transform='';el=null});})();

const EN_WEB=/\.github\.io$/.test(location.hostname)||location.hostname==='localhost';
let actPendiente=false;
// Nunca se recarga con una ventana abierta ni con una partida empezada
function seguroRecargar(){if(!$('#sheet').hidden)return false;if(APP.enPartida&&APP.enPartida())return false;return true}
function actualizar(){if(!seguroRecargar()){actPendiente=true;return}
  $('#barra-act').hidden=false;setTimeout(()=>location.replace(location.pathname+'?u='+Date.now()),900);}
let lastCheck=0;
async function buscarVersion(force){
  if(!EN_WEB)return null;if(!force&&Date.now()-lastCheck<4000)return null;lastCheck=Date.now();
  try{const txt=await (await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'})).text();
    const m=txt.match(/name="app-version" content="([^"]+)"/);
    if(m&&verCmp(m[1],VERSION)>0){actualizar();return m[1]}return VERSION;}catch(e){return null}}
function revisarPendiente(){if(actPendiente&&seguroRecargar()){actPendiente=false;actualizar()}}
new MutationObserver(revisarPendiente).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['hidden','class']});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')buscarVersion()});
setInterval(buscarVersion,90*1000);addEventListener('focus',()=>buscarVersion());addEventListener('pageshow',()=>buscarVersion());

/* ===================== JUEGO ===================== */
/* Torre de Azulejos: apila azulejos con un toque */
const cv=$('#cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,BH=36,W0=240,TILE={};
// Paletas de azulejo: fondo, estrella, centro
const PAL=[['#1f4e9c','#f2ead8','#c98a1b'],['#f2ead8','#2e7d4f','#1f2a44'],['#c98a1b','#1f2a44','#f2ead8'],
           ['#2e7d4f','#f2ead8','#a23b2a'],['#1f2a44','#c98a1b','#f2ead8'],['#a23b2a','#f2ead8','#1f4e9c']];
const NOTAS=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5,1567.98,1760];

function hoyStr(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function metaHoy(){return 18+hashStr('torre'+hoyStr())%23}
function ayerStr(){const d=new Date();d.setDate(d.getDate()-1);return hoyStr(d)}

/* ---------- Dibujo de un azulejo (se prepara una vez por tamaño) ---------- */
function hacerAzulejo(p){const s=Math.round(BH*DPR),c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d');
  const [bg,st,ce]=PAL[p];g.fillStyle=bg;g.fillRect(0,0,s,s);
  const m=s/2,r=s*.40;
  // Estrella de ocho puntas: dos cuadrados girados
  g.fillStyle=st;g.beginPath();for(const a0 of [0,Math.PI/4]){for(let k=0;k<4;k++){const a=a0+k*Math.PI/2;const x=m+r*Math.cos(a),y=m+r*Math.sin(a);k?g.lineTo(x,y):g.moveTo(x,y)}g.closePath()}g.fill('nonzero');
  // Lazo interior (octógono hueco) y centro
  g.strokeStyle=bg;g.lineWidth=s*.06;g.beginPath();for(let k=0;k<8;k++){const a=k*Math.PI/4+Math.PI/8,x=m+r*.62*Math.cos(a),y=m+r*.62*Math.sin(a);k?g.lineTo(x,y):g.moveTo(x,y)}g.closePath();g.stroke();
  g.fillStyle=ce;g.beginPath();g.arc(m,m,s*.1,0,Math.PI*2);g.fill();
  // Puntas de las esquinas (se unen con los azulejos vecinos)
  g.fillStyle=ce;for(const [x,y] of [[0,0],[s,0],[0,s],[s,s]]){g.beginPath();g.moveTo(x,y-s*.16);g.lineTo(x+s*.16,y);g.lineTo(x,y+s*.16);g.lineTo(x-s*.16,y);g.closePath();g.fill()}
  // Llaga (junta) entre azulejos
  g.strokeStyle='rgba(0,0,0,.28)';g.lineWidth=Math.max(1,s*.025);g.strokeRect(0,0,s,s);
  return c;}

function medir(){DPR=Math.min(window.devicePixelRatio||1,3);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  const nbh=Math.round(Math.max(28,Math.min(46,H*.055)));
  if(nbh!==BH||!TILE[0]||TILE.dpr!==DPR){BH=nbh;TILE={dpr:DPR};for(let p=0;p<PAL.length;p++)TILE[p]=hacerAzulejo(p)}
  W0=Math.round(Math.min(W*.62,330));}
addEventListener('resize',()=>{if(!$('#juego').hidden){medir();dibujar()}});

let S=null,raf=0,tPrev=0;
const est={get best(){return store.get(P+'-best',0)},set best(v){store.set(P+'-best',v)},
  get combo(){return store.get(P+'-combo',0)},set combo(v){store.set(P+'-combo',v)}};
function diaInfo(){const d=store.get(P+'-dia',{});if(d.ult&&d.ult!==hoyStr()&&d.ult!==ayerStr())d.racha=0;return d}

function nueva(modo){medir();
  const pal0=modo==='dia'?hashStr(hoyStr())%PAL.length:Math.floor(Math.random()*PAL.length);
  S={modo,estado:'juego',pila:[{x:(W-W0)/2,w:W0,p:pal0}],mov:null,cam:0,caidas:[],fx:[],textos:[],combo:0,maxCombo:0,
     pal0,meta:modo==='dia'?metaHoy():0,metaOk:false,lado:Math.random()<.5?1:-1,empezado:false,temblor:0};
  nuevoMovil();$('#tap-hint').hidden=false;actHud();}
function nuevoMovil(){const top=S.pila[S.pila.length-1],n=S.pila.length;S.lado*=-1;
  const izq=W*.06-top.w/2,der=W*.94-top.w/2;
  S.mov={x:S.lado>0?izq:der,w:top.w,p:(S.pal0+n)%PAL.length,dir:S.lado,izq,der};}
function velocidad(){const n=S.pila.length;return W*Math.min(1.35,.5+.022*n)}
const pisos=()=>S.pila.length-1;

function soltar(){if(!S||S.estado!=='juego')return;
  if(!S.empezado){S.empezado=true;$('#tap-hint').hidden=true}
  const m=S.mov,top=S.pila[S.pila.length-1],n=S.pila.length;
  const izq=Math.max(m.x,top.x),der=Math.min(m.x+m.w,top.x+top.w),sol=der-izq;
  if(sol<=0){// Fuera: el azulejo cae entero
    S.caidas.push({x:m.x,y:-(n+1)*BH,w:m.w,p:m.p,vx:m.dir*60,vy:0,rot:0,vr:m.dir*2});S.mov=null;fin();return}
  const tol=Math.max(4,BH*.14);
  if(Math.abs(m.x-top.x)<=tol){// ¡Perfecto!
    S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);let x=top.x,w=top.w;
    if(S.combo>=3&&w<W0){const g=Math.min(BH*.5,W0-w);x-=g/2;w+=g;x=Math.max(2,Math.min(W-w-2,x))}
    S.pila.push({x,w,p:m.p});S.fx.push({x,w,y:-(n+1)*BH,t:0});
    S.textos.push({txt:S.combo>1?`¡Perfecto! ×${S.combo}`:'¡Perfecto!',x:x+w/2,y:-(n+1)*BH,t:0});
    tono(NOTAS[Math.min(S.combo-1,NOTAS.length-1)],.22,'triangle',.22);if(S.combo>=3)tono(NOTAS[Math.min(S.combo+1,NOTAS.length-1)],.25,'sine',.12,null,.06);
    vibrar(12);
  }else{// Se corta lo que sobresale
    S.combo=0;S.pila.push({x:izq,w:sol,p:m.p});
    const cx=m.x<top.x?m.x:der,cw=m.w-sol,dir=m.x<top.x?-1:1;
    S.caidas.push({x:cx,y:-(n+1)*BH,w:cw,p:m.p,vx:dir*90,vy:-60,rot:0,vr:dir*(2+Math.random()*2)});
    tono(170,.12,'triangle',.25);ruido(.12,.12,900);vibrar(8);
  }
  if(S.modo==='dia'&&!S.metaOk&&pisos()>=S.meta)metaCumplida();
  if(pisos()%10===0)anunciar(`${pisos()} pisos`);
  nuevoMovil();actHud();}

function metaCumplida(){S.metaOk=true;const d=diaInfo(),h=hoyStr();
  if(d.ult!==h){d.racha=(d.ult===ayerStr()?(d.racha||0):0)+1;d.ult=h;store.set(P+'-dia',d)}
  S.textos.push({txt:'🏁 ¡Reto del día cumplido!',x:W/2,y:-(S.pila.length)*BH-BH*1.5,t:0,big:1});
  [0,.1,.2,.3].forEach((dl,i)=>tono(NOTAS[i*2],.3,'triangle',.2,null,dl));vibrar([20,40,20]);anunciar('Reto del día cumplido');}

function fin(){S.estado='cayendo';S.temblor=REDUCIR()?0:10;tono(330,.5,'sawtooth',.12,90);vibrar(60);
  setTimeout(()=>{if(!S)return;S.estado='fin';const p=pisos(),rec=p>est.best;if(rec)est.best=p;if(S.maxCombo>est.combo)est.combo=S.maxCombo;
    $('#f-t').textContent=rec&&p>0?'🏆 ¡Nuevo récord!':'¡Se cayó!';$('#f-score').textContent=p;$('#f-sub').textContent=p===1?'piso':'pisos';
    let ex=`Récord: ${est.best} · Mejor racha: ${est.combo} perfectos`;
    if(S.modo==='dia')ex=S.metaOk?`✓ Reto del día cumplido (${S.meta} pisos) · Racha: ${diaInfo().racha||1} ${diaInfo().racha===1?'día':'días'}`:`Meta de hoy: ${S.meta} pisos. ¡Te faltaron ${S.meta-p}!`;
    $('#f-extra').textContent=ex;$('#o-fin').hidden=false;$('#b-otra').focus();
    anunciar(`Fin de la partida. ${p} pisos. ${ex}`);if(rec&&p>0)[0,.12,.24].forEach((dl,i)=>tono(NOTAS[4+i],.3,'triangle',.2,null,dl));},800);}

function actHud(){$('#h-score').textContent=pisos();
  let sub='';if(S.modo==='dia')sub=S.metaOk?'✓ Reto cumplido':`Meta de hoy: ${S.meta}`;
  if(S.combo>=2)sub=(sub?sub+' · ':'')+`Racha ×${S.combo}`;$('#h-sub').textContent=sub;
  cv.setAttribute('aria-label',`Torre de ${pisos()} pisos`);}

/* ---------- Bucle ---------- */
function paso(t){raf=requestAnimationFrame(paso);const dt=Math.min(.05,(t-(tPrev||t))/1000);tPrev=t;
  if(!S||S.estado==='pausa')return;
  if(S.estado==='juego'&&S.mov){const m=S.mov;m.x+=m.dir*velocidad()*dt;
    if(m.x>m.der){m.x=m.der;m.dir=-1}if(m.x<m.izq){m.x=m.izq;m.dir=1}}
  const objetivo=Math.max(0,(S.pila.length+1)*BH-H*.52);S.cam+=(objetivo-S.cam)*Math.min(1,dt*6);
  for(const c of S.caidas){c.vy+=2200*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.rot+=c.vr*dt}
  S.caidas=S.caidas.filter(c=>c.y+S.cam<H+200);
  S.fx.forEach(f=>f.t+=dt);S.fx=S.fx.filter(f=>f.t<.5);S.textos.forEach(f=>f.t+=dt);S.textos=S.textos.filter(f=>f.t<(f.big?2.2:1));
  if(S.temblor>0)S.temblor=Math.max(0,S.temblor-dt*30);
  dibujar();}

function mezcla(a,b,k){const pa=a.match(/\w\w/g).map(h=>parseInt(h,16)),pb=b.match(/\w\w/g).map(h=>parseInt(h,16));
  return '#'+pa.map((v,i)=>Math.round(v+(pb[i]-v)*k).toString(16).padStart(2,'0')).join('')}
const CIELO=[[0,'87b9e8','f7e6c6'],[22,'4b4f8f','f09a63'],[45,'101a3d','4a2f62'],[75,'03050f','101a3d']];
function cielo(n){for(let i=CIELO.length-1;i>=0;i--)if(n>=CIELO[i][0]){const a=CIELO[i],b=CIELO[i+1]||a;const k=b===a?0:(n-a[0])/(b[0]-a[0]);return [mezcla(a[1],b[1],k),mezcla(a[2],b[2],k)]}}
const ESTRELLAS=Array.from({length:70},()=>[Math.random(),Math.random(),Math.random()*1.4+.4]);

function dibujar(){if(!S)return;ctx.setTransform(DPR,0,0,DPR,0,0);
  const n=S.cam/BH,[c1,c2]=cielo(n);const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#'+c1.slice(1));gr.addColorStop(1,'#'+c2.slice(1));
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  if(n>30){ctx.fillStyle='#fff';const a=Math.min(1,(n-30)/25);for(const [x,y,r] of ESTRELLAS){ctx.globalAlpha=a*(.4+.6*((y*997+performance.now()/900)%1>.5?1:.6));ctx.beginPath();ctx.arc(x*W,((y*H*1.6+S.cam*.15)%(H*1.2)),r,0,7);ctx.fill()}ctx.globalAlpha=1}
  const sx=S.temblor?(Math.random()-.5)*S.temblor:0;ctx.save();ctx.translate(sx,0);
  const g0=H-Math.max(70,H*.12);const Y=wy=>g0+wy+S.cam;
  // Arquería al fondo (parallax)
  const ya=g0+S.cam*.35;if(ya-H*.32<H){ctx.fillStyle='rgba(255,255,255,.10)';const aw=W/5;
    ctx.beginPath();ctx.rect(0,ya-H*.32,W,H*.32+H);for(let i=0;i<6;i++){const cx=i*aw+aw/2-aw*.5+aw*.5;const r=aw*.32;ctx.moveTo(cx-r,ya+H);ctx.lineTo(cx-r,ya-H*.16);ctx.arc(cx,ya-H*.16,r,Math.PI,0);ctx.lineTo(cx+r,ya+H)}ctx.fill('evenodd')}
  // Basamento de mármol
  const yb=Y(0);if(yb<H){const gm=ctx.createLinearGradient(0,yb,0,H);gm.addColorStop(0,'#efe9df');gm.addColorStop(1,'#cfc6b8');ctx.fillStyle=gm;ctx.fillRect(0,yb,W,H-yb+S.cam+10);
    ctx.fillStyle='rgba(0,0,0,.12)';ctx.fillRect(0,yb,W,3)}
  // Línea de la meta del día
  if(S.modo==='dia'){const ym=Y(-(S.meta+1)*BH);if(ym>-20&&ym<H+20){ctx.save();ctx.setLineDash([10,8]);ctx.strokeStyle=S.metaOk?'#5fd38a':'#ffd34d';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(0,ym);ctx.lineTo(W,ym);ctx.stroke();ctx.restore();ctx.fillStyle=S.metaOk?'#5fd38a':'#ffd34d';ctx.font='800 14px system-ui,sans-serif';ctx.textAlign='left';
    ctx.fillText(S.metaOk?'✓ Meta de hoy':`🏁 Meta de hoy: ${S.meta}`,12,ym-8)}}
  // Torre
  for(let i=0;i<S.pila.length;i++){const b=S.pila[i],y=Y(-(i+1)*BH);if(y>H||y<-BH)continue;bloque(b.x,y,b.w,b.p,i===0)}
  if(S.mov&&S.estado==='juego'){const n2=S.pila.length;bloque(S.mov.x,Y(-(n2+1)*BH),S.mov.w,S.mov.p)}
  for(const c of S.caidas){ctx.save();ctx.translate(c.x+c.w/2,Y(c.y)+BH/2);ctx.rotate(c.rot);bloque(-c.w/2,-BH/2,c.w,c.p);ctx.restore()}
  for(const f of S.fx){const k=f.t/.5,e=BH*.6*k;ctx.strokeStyle=`rgba(255,255,255,${1-k})`;ctx.lineWidth=3;ctx.strokeRect(f.x-e,Y(f.y)-e,f.w+2*e,BH+2*e)}
  ctx.textAlign='center';for(const f of S.textos){const k=f.t/(f.big?2.2:1);ctx.globalAlpha=1-k*k;ctx.font=`900 ${f.big?22:18}px system-ui,sans-serif`;
    ctx.fillStyle='#fff';ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=4;const y=Y(f.y)-14-k*40;ctx.strokeText(f.txt,Math.max(90,Math.min(W-90,f.x)),y);ctx.fillText(f.txt,Math.max(90,Math.min(W-90,f.x)),y)}
  ctx.globalAlpha=1;ctx.restore();}

function bloque(x,y,w,p,base){if(w<=0)return;ctx.save();ctx.beginPath();ctx.rect(x,y,w,BH);ctx.clip();
  const t=TILE[p];if(base){ctx.fillStyle='#efe9df';ctx.fillRect(x,y,w,BH);ctx.fillStyle='#b9ad99';ctx.fillRect(x,y+BH-4,w,4)}
  else for(let k=Math.floor(x/BH);k*BH<x+w;k++)ctx.drawImage(t,k*BH,y,BH,BH);
  ctx.restore();ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(x,y,w,2);ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(x,y+BH-2,w,2);
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w-1,BH-1);}

/* ---------- Pantallas ---------- */
function abrir(modo){$('#menu').hidden=true;$('#juego').hidden=false;$('#o-fin').hidden=true;$('#o-pausa').hidden=true;
  history.pushState({juego:1},'');nueva(modo);tPrev=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(paso);$('#juego').focus?.();}
function salir(fromPop){cancelAnimationFrame(raf);S=null;$('#juego').hidden=true;$('#menu').hidden=false;pintarMenu();
  if(!fromPop&&history.state&&history.state.juego){skipPop=true;history.back()}$('#b-jugar').focus();}
function pausa(){if(S&&S.estado==='juego'){S.estado='pausa';$('#o-pausa').hidden=false;$('#b-seguir').focus()}}
function seguir(){if(S&&S.estado==='pausa'){S.estado='juego';$('#o-pausa').hidden=true;tPrev=0}}
APP.enPantallaJuego=()=>!$('#juego').hidden;
APP.enPartida=()=>!!S&&(S.estado==='juego'||S.estado==='pausa'||S.estado==='cayendo')&&S.empezado;
APP.salir=salir;
APP.onSheet=abierta=>{if(abierta)pausa()};

$('#juego').addEventListener('pointerdown',e=>{if(e.target.closest('button,.over'))return;e.preventDefault();soltar()});
addEventListener('keydown',e=>{if($('#juego').hidden||!$('#sheet').hidden)return;
  if((e.key===' '||e.key==='Enter')&&S&&S.estado==='juego'&&!e.target.closest('button')){e.preventDefault();if(!e.repeat)soltar()}
  else if(e.key==='Escape'){e.preventDefault();if(S&&S.estado==='pausa')seguir();else if(S&&S.estado==='juego')pausa();else salir()}
  else if((e.key==='p'||e.key==='P')&&S&&S.estado==='juego')pausa();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pausa()});
$('#b-salir').addEventListener('click',()=>salir());$('#b-pausa').addEventListener('click',pausa);$('#b-seguir').addEventListener('click',seguir);
$('#b-menu1').addEventListener('click',()=>salir());$('#b-menu2').addEventListener('click',()=>salir());
$('#b-otra').addEventListener('click',()=>{$('#o-fin').hidden=true;nueva(S?S.modo:'libre')});
$('#b-jugar').addEventListener('click',()=>abrir('libre'));$('#b-dia').addEventListener('click',()=>abrir('dia'));
$('#b-como').addEventListener('click',()=>openSheet(`<h2>Cómo se juega</h2>
  <ol class="howto"><li>Un azulejo va y viene por encima de la torre. <b>Toca la pantalla</b> (o pulsa la barra espaciadora) para soltarlo.</li>
  <li>Lo que sobresale <b>se corta y cae</b>: el siguiente azulejo será igual de estrecho.</li>
  <li>Si lo sueltas <b>justo encima</b>, ganas un «¡Perfecto!» y no pierdes nada. Con <b>3 perfectos seguidos</b>, el azulejo vuelve a crecer.</li>
  <li>Cada piso va un poco más rápido. Si fallas del todo, la partida se acaba.</li>
  <li>En el <b>Reto del día</b> hay una altura que alcanzar, la misma para todos ese día. Cúmplela varios días seguidos para hacer racha.</li></ol>
  <div class="sheet-nav"><button class="btn block" data-close="btn">¡A jugar!</button></div>`,'Cómo se juega'));

function pintarMenu(){const d=diaInfo(),hecho=d.ult===hoyStr();
  $('#dia-d').textContent=hecho?`✓ Hecho hoy · racha de ${d.racha} ${d.racha===1?'día':'días'}`:`Hoy: llega a ${metaHoy()} pisos${d.racha?` · racha de ${d.racha}`:''}`;
  const b=est.best,c=est.combo;$('#records').innerHTML=b?`<span class="rec">🏆 Récord: ${b} pisos</span>${c?`<span class="rec">✨ Mejor racha: ${c}</span>`:''}`:'';}
pintarMenu();

arrancarComun();
</script>
